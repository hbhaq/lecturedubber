# Standalone file: use -f compose.production.yaml, not together with compose.yaml.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lectures
      POSTGRES_USER: lectures
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/configure-admin.py first}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lectures"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  api:
    build: ./backend
    env_file: .env
    environment: &runtime
      AUTH_REQUIRED: "true"
      PUBLIC_ORIGIN: https://${SITE_HOST:?Set SITE_HOST to your domain}
      DATABASE_URL: postgresql+psycopg://lectures:${DB_PASSWORD:?Configure database password}@db:5432/lectures
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /data
    volumes: ["media:/data"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  worker:
    build: ./backend
    command: python -m app.worker
    env_file: .env
    environment: *runtime
    volumes: ["media:/data"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    environment:
      SITE_HOST: ${SITE_HOST:?Set SITE_HOST to your domain}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend]
    restart: unless-stopped
volumes:
  postgres:
  redis:
  media:
  caddy_data:
  caddy_config:
